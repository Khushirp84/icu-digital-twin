apiVersion: apps/v1
kind: Deployment
metadata:
  name: simulator
spec:
  replicas: 1
  selector:
    matchLabels:
      app: simulator
  template:
    metadata:
      labels:
        app: simulator
    spec:
      containers:
      - name: simulator
        image: icu-simulator:latest
        imagePullPolicy: Never
        env:
        - name: ORION_URL
          value: "http://orion:1026"